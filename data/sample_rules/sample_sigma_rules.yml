title: Password Spraying - Many Failed Logons From One Source
id: 6f1c2a9e-0006-4b7a-9a10-000000000006
status: test
description: Bir ünvandan qısa müddətdə çox sayda müxtəlif hesaba uğursuz giriş cəhdi.
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  timeframe: 10m
  condition: selection | count(TargetUserName) by IpAddress > 10
falsepositives:
  - Səhv konfiqurasiya olunmuş xidmət hesabları
level: medium
tags:
  - attack.credential-access
  - attack.t1110.003
