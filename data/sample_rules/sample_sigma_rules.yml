# Nümunə Sigma qaydaları (sadələşdirilmiş, öyrətmə məqsədli).
# Bir faylda bir neçə qayda "---" ilə ayrılır. "Qaydalar" səhifəsindən yükləməyi də sınaya bilərsiniz.
title: Encoded PowerShell Command Line
id: 6f1c2a9e-0001-4b7a-9a10-000000000001
status: stable
description: PowerShell kodlaşdırılmış əmr arqumenti ilə başladılıb. Skript məzmununu gizlətmək üçün tez-tez istifadə olunur.
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -e JAB'
  condition: selection_img and selection_cli
falsepositives:
  - Kodlaşdırılmış əmr işlədən inzibati skriptlər
level: medium
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
---
title: Windows Security Event Log Cleared
id: 6f1c2a9e-0002-4b7a-9a10-000000000002
status: stable
description: Security jurnalı təmizlənib (Event ID 1102). İzləri silmək cəhdi ola bilər.
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
  - Planlı jurnal təmizləmə işləri
level: high
tags:
  - attack.defense-evasion
  - attack.t1070.001
---
title: LSASS Memory Access by Non-System Process
id: 6f1c2a9e-0003-4b7a-9a10-000000000003
status: test
description: Qeyri-standart proses lsass.exe yaddaşına giriş istəyir. Kredensial dump əlaməti ola bilər.
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x1fffff'
  filter_system:
    SourceImage|startswith: 'C:\Windows\System32\'
  condition: selection and not filter_system
falsepositives:
  - Təhlükəsizlik agentləri
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
