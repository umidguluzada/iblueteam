title: Rundll32 Spawned From Office Application
id: 6f1c2a9e-0007-4b7a-9a10-000000000007
status: experimental
description: Office tətbiqi rundll32.exe prosesini işə salıb.
logsource:
  category: process_creation
  product: windows
detection:
