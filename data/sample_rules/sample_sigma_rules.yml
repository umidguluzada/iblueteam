title: Shadow Copy Deletion via vssadmin
id: 6f1c2a9e-0011-4b7a-9a10-000000000011
status: stable
description: vssadmin ilə kölgə nüsxələrinin silinməsi. Şifrələyici zərərverici proqramlarda geniş yayılıb.
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
falsepositives:
  - Ehtiyat proqramlarının təmizləmə əməliyyatları
level: high
tags:
  - attack.impact
  - attack.t1490
