    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
    Image|endswith: '\rundll32.exe'
  condition: selection
falsepositives:
  - Nadir makro əsaslı korporativ alətlər
level: high
tags:
  - attack.defense-evasion
  - attack.t1218.011
  - attack.execution
  - attack.t1204.002
