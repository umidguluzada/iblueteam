<!doctype html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iBlueTeam: Detection Coverage Matrix</title>
  <script>
    /* Mövzunu səhifə çəkilməzdən əvvəl tətbiq et ki, işıq-qaranlıq sıçrayışı olmasın */
    try {
      var t = localStorage.getItem("ibt-theme");
      var l = localStorage.getItem("ibt-lang");
      if (l === "en" || l === "az") { document.documentElement.lang = l; document.documentElement.dataset.lang = l; }
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>

        <rect x="2" y="2" width="9" height="9" rx="2.2" class="m-full"/>
        <rect x="13" y="2" width="9" height="9" rx="2.2" class="m-gap"/>
        <rect x="2" y="13" width="9" height="9" rx="2.2" class="m-gap"/>
        <rect x="13" y="13" width="9" height="9" rx="2.2" class="m-part"/>
      </svg>

    <nav class="nav" aria-label="Əsas naviqasiya">
